on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs pkgdown, the package itself, and its GitHub remotes.
      # We avoid r-lib/actions/setup-r-dependencies (pak) because pak's
      # lockfile_create() calls the GitHub REST API directly and can fail
      # with a transient error (e.g. HTTP 503) when resolving GitHub
      # remotes. 'remotes' authenticates via GITHUB_PAT and is more
      # resilient. See .github/workflows/R-CMD-check.yaml for the same
      # workaround.
      - name: Install dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "pkgdown"))
          install_github_retry <- function(repo, ..., attempts = 3L) {
            for (i in seq_len(attempts)) {
              tryCatch({
                remotes::install_github(repo, upgrade = "never", ...)
                return(invisible(NULL))
              }, error = function(e) {
                if (i == attempts) stop(e)
                message("install_github('", repo, "') failed (attempt ", i, "/", attempts, "): ", conditionMessage(e), "\nRetrying...")
                Sys.sleep(5)
              })
            }
          }
          install_github_retry("yiqunchen/KmeansInference")
          install_github_retry("lucylgao/clusterpval")
          remotes::install_deps(dependencies = TRUE)
          remotes::install_local(upgrade = "never")

      - name: Build site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
